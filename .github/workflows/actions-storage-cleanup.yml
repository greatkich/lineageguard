name: Actions Storage Cleanup

on:
  push:
    paths:
      - '.github/workflows/actions-storage-cleanup.yml'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          deleted=0
          bytes=0
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .size_in_bytes, .created_at, .name] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id size created name; do
            [ -z "${id:-}" ] && continue
            created_epoch=$(date -u -d "$created" +%s)
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Deleting artifact $id ($name, $size bytes, created $created)"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
              deleted=$((deleted + 1)); bytes=$((bytes + size))
            fi
          done < /tmp/artifacts.tsv
          echo "Deleted $deleted artifacts; reclaimed approximately $bytes bytes." >> "$GITHUB_STEP_SUMMARY"
