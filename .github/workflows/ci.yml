name: CI
on:
  push:
    branches: [main, fix/mvp-audit-recovery]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lineageguard
          POSTGRES_PASSWORD: lineageguard
          POSTGRES_DB: lineageguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          LINEAGEGUARD_DATABASE_URL: postgresql://lineageguard:lineageguard@127.0.0.1:5432/lineageguard
