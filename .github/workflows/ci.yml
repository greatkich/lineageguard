name: CI
# TEMPORARILY DISABLED while the canonical live demo is being completed on
# fix/demo-readiness-final. The gates are being run locally on Node 24 against real
# DataHub, PostgreSQL, and Docker, which this hosted runner cannot provide, so the
# automatic runs on every push and PR were reporting on an environment that is not
# the one the work is verified against.
#
# The job below is unchanged. To restore automatic runs, delete the workflow_dispatch
# line and reinstate:
#
#   push:
#     branches: [main, fix/mvp-audit-recovery]
#   pull_request:
#     branches: [main]
#
# Until then it can still be triggered by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lineageguard
          POSTGRES_PASSWORD: lineageguard
          POSTGRES_DB: lineageguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create lineageguard schema
        run: |
          PGPASSWORD=lineageguard psql -h 127.0.0.1 -U lineageguard -d lineageguard \
            -c "CREATE SCHEMA IF NOT EXISTS lineageguard;"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          LINEAGEGUARD_DATABASE_URL: postgresql://lineageguard:lineageguard@127.0.0.1:5432/lineageguard
