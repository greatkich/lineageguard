name: CI
# Manual dispatch only while the demo is being finished.
#
# The hosted runner has no DataHub, no seeded walkthrough PostgreSQL, and none of the
# content-addressed validator images, so it cannot exercise the live acceptance path — and every
# push would spend a runner re-proving only the deterministic gates that are already run locally.
#
# To re-enable automatic runs once the demo is READY, restore:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lineageguard
          POSTGRES_PASSWORD: lineageguard
          POSTGRES_DB: lineageguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create lineageguard schema
        run: |
          PGPASSWORD=lineageguard psql -h 127.0.0.1 -U lineageguard -d lineageguard \
            -c "CREATE SCHEMA IF NOT EXISTS lineageguard;"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          LINEAGEGUARD_DATABASE_URL: postgresql://lineageguard:lineageguard@127.0.0.1:5432/lineageguard
