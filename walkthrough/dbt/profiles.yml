lineageguard_walkthrough:
  target: canonical
  outputs:
    canonical:
      type: postgres
      host: "{{ env_var('WALKTHROUGH_POSTGRES_HOST') }}"
      port: "{{ env_var('WALKTHROUGH_POSTGRES_PORT') | int }}"
      user: "{{ env_var('WALKTHROUGH_POSTGRES_USER') }}"
      password: "{{ env_var('WALKTHROUGH_POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('WALKTHROUGH_POSTGRES_DATABASE') }}"
      schema: analytics
      threads: 2
      connect_timeout: 10
      sslmode: prefer
