version: 2

sources:
  - name: commerce
    schema: commerce
    tables:
      - name: orders
        description: Canonical order events emitted by the commerce service.
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            description: Stable customer identifier used by downstream consumers.
            data_tests: [not_null]

models:
  - name: stg_orders
    description: Typed staging projection of commerce orders.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
