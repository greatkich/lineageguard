source:
  type: postgres
  config:
    host_port: "${WALKTHROUGH_POSTGRES_HOST}:${WALKTHROUGH_POSTGRES_PORT}"
    database: "${WALKTHROUGH_POSTGRES_DATABASE}"
    username: "${WALKTHROUGH_INGEST_POSTGRES_USER}"
    password: "${WALKTHROUGH_INGEST_POSTGRES_PASSWORD}"
    options:
      sslmode: "${WALKTHROUGH_POSTGRES_SSLMODE}"
    platform_instance: lineageguard-canonical
    env: PROD
    include_usage_statistics: false
    include_query_lineage: false
    include_view_lineage: false
    include_view_column_lineage: false
    include_table_location_lineage: false
    schema_pattern:
      allow:
        - commerce
        - analytics
        - fraud
    table_pattern:
      allow:
        - "^commerce\\.orders$"
        - "^analytics\\.stg_orders$"
        - "^analytics\\.customer_revenue$"
        - "^fraud\\.customer_features$"
sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
    token: "${DATAHUB_INGEST_TOKEN}"
