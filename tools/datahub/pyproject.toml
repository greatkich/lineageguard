[project]
name = "lineageguard-datahub"
version = "0.1.0"
description = "LineageGuard DataHub ingestion utilities"
requires-python = "==3.12.*"

dependencies = [
    "acryl-datahub[postgres]==1.6.0.17",
    "dbt-core==1.12.0",
    "dbt-postgres==1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineageguard_datahub"]
