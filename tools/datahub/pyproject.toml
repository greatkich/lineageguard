[project]
name = "lineageguard-datahub"
version = "0.1.0"
description = "Deterministic DataHub graph tooling for the LineageGuard canonical walkthrough"
requires-python = ">=3.12,<3.13"
dependencies = [
  "acryl-datahub[postgres]==1.6.0.17",
  "dbt-core==1.12.0",
  "dbt-postgres==1.11.0",
  "psycopg[binary]>=3.2.10,<4",
]

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.7,<0.13",
]

[project.scripts]
lineageguard-datahub = "lineageguard_datahub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineageguard_datahub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lineageguard_datahub"]
